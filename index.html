<!DOCTYPE html> <!-- Объявляем, что документ использует современный HTML5 -->
 <html lang="ru"> <!--Начинаем HTML-документ и указываем русский язык -->
<head> <!-- Начинаем служебную часть страницы -->
    <meta charset="UTF-8"> <!-- Указываем кодировку UTF-8 для корректного отображения текста -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Настраиваем отображение страницы на разных экранах -->
    <title>Человек паук</title> <!-- Указываем название страницы во вкладке браузера -->
    <link rel="stylesheet" href="style.css"> <!-- Подключаем внешний файл CSS -->
</head> <!-- Закрываем служебную часть страницы -->

<body> <!-- Начинаем видимую часть страницы -->

    <header class="header"> <!-- Создаём верхнюю часть страницы и задаём ей класс -->
        <h1>Мой любимый фильм</h1> <!-- Создаём главный заголовок страницы -->
    </header> <!-- Закрываем header -->

    <main> <!-- Начинаем основное содержимое страницы -->

        <section class="card"> <!-- Создаём основную секцию с карточкой фильма -->

            <img class="poster" src="загрузка.webp" alt="Постер фильма"> <!-- Добавляем изображение и задаём альтернативный текст -->

            <div class="content"> <!-- Создаём блок для текста и остальных элементов -->

                <h2>Человек паук</h2> <!-- Создаём заголовок с названием фильма -->

                <p class="description">Краткое описание фильма.</p> <!-- Добавляем описание фильма -->

                <h3>Интересные факты</h3> <!-- Создаём заголовок для списка фактов -->

                <ul class="facts"> <!-- Создаём маркированный список -->
                    <li>Паутина растворяется</li> <!-- Добавляем первый пункт списка -->
                    <li>Имя человека паука Питер паркер</li> <!-- Добавляем второй пункт списка -->
                    <li>Первый фильм вышел в 2002</li> <!-- Добавляем третий пункт списка -->
                </ul> <!-- Закрываем список -->

                <a href="https://example.com" target="_blank">Подробнее о фильме</a> <!-- Создаём ссылку на дополнительную информацию -->

                <button class="button">Посмотреть трейлер</button> <!-- Создаём кнопку и задаём ей класс -->

            </div> <!-- Закрываем текстовый блок -->

        </section> <!-- Закрываем секцию с карточкой -->

    </main> <!-- Закрываем основное содержимое -->

    <footer> <!-- Создаём нижнюю часть страницы -->
        <p>Работу выполнил: Ваше имя</p> <!-- Добавляем подпись автора работы -->
    </footer> <!-- Закрываем footer -->

</body> <!-- Закрываем видимую часть страницы -->
</html> <!-- Завершаем HTML-документ -->
